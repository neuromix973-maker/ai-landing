name: Build NeuroGraf Voice AI APK

on:
  push:
    branches:
      - neurograf-voice-ai-apk
    paths:
      - 'neurograf-voice-ai/**'
      - '.github/workflows/neurograf-voice-ai-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurograf-voice-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroGraf-Voice-AI-debug-apk
          path: neurograf-voice-ai/app/build/outputs/apk/debug/app-debug.apk
