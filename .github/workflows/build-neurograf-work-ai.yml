name: Build NEUROGRAF WORK AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "neurograf-work-ai" ]
    paths:
      - "neurograf-work-ai/android/**"
      - ".github/workflows/build-neurograf-work-ai.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release
        run: gradle -p neurograf-work-ai/android :app:assembleRelease --no-daemon

      - name: Align release APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -p -f 4             neurograf-work-ai/android/app/build/outputs/apk/release/app-release-unsigned.apk             NEUROGRAF_WORK_AI_v0_5_RELEASE_ALIGNED_UNSIGNED.apk
          "$ZIPALIGN" -c -v 4 NEUROGRAF_WORK_AI_v0_5_RELEASE_ALIGNED_UNSIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEUROGRAF_WORK_AI_v0_5_RELEASE_ALIGNED_UNSIGNED_APK
          path: NEUROGRAF_WORK_AI_v0_5_RELEASE_ALIGNED_UNSIGNED.apk
          retention-days: 90
