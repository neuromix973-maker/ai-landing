name: Build EXCAVATOR PRO RELEASE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified EXCAVATOR PRO icon
        shell: bash
        run: |
          set -euo pipefail
          cat             .github/icon_webp/q70_1.b64             .github/icon_webp/q70_2.b64             .github/icon_webp/q70_3.b64             > /tmp/excavator_icon.b64
          test "$(wc -c < /tmp/excavator_icon.b64)" -eq 10440
          base64 -d /tmp/excavator_icon.b64 > /tmp/excavator_pro_icon.webp
          echo "3a7ec9556c05746e6398a35f5f4255c3091f4d2a3315905cf62a5f87138fa33e  /tmp/excavator_pro_icon.webp" | sha256sum -c -
          file /tmp/excavator_pro_icon.webp
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp /tmp/excavator_pro_icon.webp "app/src/main/res/mipmap-$d/excavator_pro_icon.webp"
          done

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Align unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             EXCAVATOR_PRO_v15_13_8_RELEASE_ALIGNED_UNSIGNED.apk
          "$ZIPALIGN" -c -v 4 EXCAVATOR_PRO_v15_13_8_RELEASE_ALIGNED_UNSIGNED.apk

      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: EXCAVATOR_PRO_v15_13_8_RELEASE_ALIGNED_UNSIGNED_APK
          path: EXCAVATOR_PRO_v15_13_8_RELEASE_ALIGNED_UNSIGNED.apk
          retention-days: 90

      - name: Export Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)"
          test -f "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" ./apksigner.jar
          java -jar ./apksigner.jar --version

      - name: Upload Android apksigner
        uses: actions/upload-artifact@v4
        with:
          name: ANDROID_APKSIGNER_JAR
          path: apksigner.jar
          retention-days: 30
