name: Build EXCAVATOR PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore final EXCAVATOR PRO icon
        shell: bash
        run: |
          set -euo pipefail
          cat             .github/icon_parts/part1.b64             .github/icon_parts/part1_tail.b64             .github/icon_parts/part2.b64             .github/icon_parts/part2_tail.b64             .github/icon_parts/part3.b64             .github/icon_parts/part4.b64             .github/icon_parts/part5.b64             > /tmp/excavator_icon.b64
          test "$(wc -c < /tmp/excavator_icon.b64)" -eq 42192
          base64 -d /tmp/excavator_icon.b64 > /tmp/excavator_pro_icon.png
          echo "3b9140e99bb0ee1e3e75ee8acf05b048c40d82429b63d9fd2301258e7890603d  /tmp/excavator_pro_icon.png" | sha256sum -c -
          file /tmp/excavator_pro_icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp /tmp/excavator_pro_icon.png "app/src/main/res/mipmap-$d/excavator_pro_icon.png"
          done

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EXCAVATOR_PRO_v15_13_7_ICON_REAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXCAVATOR_PRO_v15_13_7_ICON_REAL_APK
          path: EXCAVATOR_PRO_v15_13_7_ICON_REAL.apk
          retention-days: 90
