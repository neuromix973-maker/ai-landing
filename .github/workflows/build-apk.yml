name: Build EXCAVATOR PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EXCAVATOR_PRO_v15_12_3_ADAPTIVE_ICON.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXCAVATOR_PRO_v15_12_3_ADAPTIVE_ICON_APK
          path: EXCAVATOR_PRO_v15_12_3_ADAPTIVE_ICON.apk
          retention-days: 90
