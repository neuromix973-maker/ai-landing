plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jyotisha.darpana'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jyotisha.darpana'
        minSdk 24
        targetSdk 35
        versionCode 45
        versionName '3.4.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
